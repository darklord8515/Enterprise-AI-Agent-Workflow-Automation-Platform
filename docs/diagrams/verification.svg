<text x="729" y="495.0" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11.5" font-weight="400" fill="#5a6273" text-anchor="middle" >still unsupported</text>
<text x="40" y="606" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55514a" text-anchor="start" >Tested with scripted model outputs: fabricated chunk ids, paraphrased quotes and policy-as-proof are all caught (tests/test_workflow.py).</text>
