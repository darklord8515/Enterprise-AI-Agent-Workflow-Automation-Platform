<text x="40" y="52" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1b1a17">Evidence verification</text><text x="40" y="78" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#55514a">The reviewer is code, not a prompt. A conclusion survives only if its evidence can be checked against what was retrieved.</text><rect x="40" y="150" width="170" height="104" rx="12" fill="#faf9f6" stroke="#d9d5cc" stroke-width="1.3"/>
<text x="58" y="178" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1b1a17" text-anchor="start" >Model citation</text>
