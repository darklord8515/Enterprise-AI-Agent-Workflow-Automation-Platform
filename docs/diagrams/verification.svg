<text x="818" y="498" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55514a" text-anchor="start" >Still unsupported after the last revision: reported as insufficient</text>
<text x="818" y="517" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55514a" text-anchor="start" >evidence with the reasons. Absence of contrary information is</text>
