<text x="1076" y="313" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55514a" text-anchor="start" >kept, with a &quot;verify manually&quot;</text>
