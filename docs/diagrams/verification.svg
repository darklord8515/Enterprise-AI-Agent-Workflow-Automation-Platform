<text x="290" y="365" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#55514a" text-anchor="start" >and a reviewer note is attached to the finding, so the removal is visible in the report</text>
<rect x="1060" y="270" width="220" height="70" rx="12" fill="#fbf3dc" stroke="#8a6100" stroke-opacity="0.45"/>
